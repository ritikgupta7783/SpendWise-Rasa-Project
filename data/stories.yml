
version: "3.1"

stories:

# ==================================================
# 1. ADD EXPENSE
# ==================================================

- story: add expense with amount and category
  steps:
    - intent: add_expense
    - action: action_add_expense


# ==================================================
# 2. COMPLETE EXPENSE AFTER CATEGORY REPLY
# ==================================================

- story: complete expense with missing category
  steps:
    - intent: add_expense
    - action: action_add_expense
    - intent: provide_category
    - action: action_complete_expense


# ==================================================
# 3. CHECK OVERALL SPENDING
# ==================================================

- story: check overall spending
  steps:
    - intent: check_total
    - action: action_check_total


# ==================================================
# 4. CHECK CATEGORY-SPECIFIC SPENDING
# ==================================================

- story: check category spending
  steps:
    - intent: check_category_total
    - action: action_check_category_total


# ==================================================
# 5. CATEGORY-WISE SUMMARY
# ==================================================

- story: view category summary
  steps:
    - intent: category_summary
    - action: action_category_summary


# ==================================================
# 6. SHOW EXPENSE HISTORY
# ==================================================

- story: view expense history
  steps:
    - intent: show_history
    - action: action_show_history


# ==================================================
# 7. CHECK DATE-WISE SPENDING
# ==================================================

- story: check spending by date
  steps:
    - intent: check_date_total
    - action: action_check_date_total


# ==================================================
# 8. FILTER EXPENSE HISTORY
# ==================================================

- story: filter expense history
  steps:
    - intent: filtered_history
    - action: action_filtered_history


# ==================================================
# 9. FIND HIGHEST EXPENSE
# ==================================================

- story: find highest expense
  steps:
    - intent: highest_expense
    - action: action_highest_expense


# ==================================================
# 10. CALCULATE AVERAGE EXPENSE
# ==================================================

- story: calculate average expense
  steps:
    - intent: average_expense
    - action: action_average_expense


# ==================================================
# 11. CATEGORY FOLLOW-UP
# ==================================================

- story: ask about another category
  steps:
    - intent: check_category_total
    - action: action_check_category_total
    - intent: followup_category
    - action: action_followup_category


# ==================================================
# 12. DELETE EXPENSE
# ==================================================

- story: delete expense
  steps:
    - intent: delete_expense
    - action: action_delete_expense


# ==================================================
# 13. SET MONTHLY BUDGET
# ==================================================

- story: set monthly budget
  steps:
    - intent: set_budget
    - action: action_set_budget


# ==================================================
# 14. CHECK BUDGET
# ==================================================

- story: check budget
  steps:
    - intent: check_budget
    - action: action_check_budget


# ==================================================
# 15. BUDGET FOLLOW-UP
# ==================================================

- story: check another category budget
  steps:
    - intent: check_budget
    - action: action_check_budget
    - intent: followup_category
    - action: action_followup_category
