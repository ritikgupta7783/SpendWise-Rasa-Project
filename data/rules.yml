version: "3.1"

rules:

  - rule: Respond to greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Respond to goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Provide help
    steps:
      - intent: bot_help
      - action: utter_help

  - rule: Handle NLU fallback
    steps:
      - intent: nlu_fallback
      - action: utter_fallback