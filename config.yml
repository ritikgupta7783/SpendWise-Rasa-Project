
# Rasa configuration

recipe: default.v1
language: en
assistant_id: spendwise_assistant

# Natural Language Understanding pipeline
pipeline:

  # 1. Split sentences into words
  - name: WhitespaceTokenizer

  # 2. Extract features from regular expressions
  - name: RegexFeaturizer

  # 3. Extract grammatical features
  - name: LexicalSyntacticFeaturizer

  # 4. Convert words into numerical features
  - name: CountVectorsFeaturizer

  # 5. Character-level features
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # 6. Intent classification and entity extraction
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true

  # 7. Map entity synonyms
  - name: EntitySynonymMapper

  # 8. Handle uncertain predictions
  - name: FallbackClassifier
    threshold: 0.30
    ambiguity_threshold: 0.10


# Dialogue management policies
policies:

  # Remember previously learned conversation paths
  - name: MemoizationPolicy
    max_history: 5

  # Handle explicitly defined conversation rules
  - name: RulePolicy

  # Predict the next conversation action
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
