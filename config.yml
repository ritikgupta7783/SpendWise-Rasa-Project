
recipe: default.v1
language: en
assistant_id: spendwise_assistant

# ==========================================
# NATURAL LANGUAGE UNDERSTANDING PIPELINE
# ==========================================

pipeline:

  # Splits user messages into individual words
  - name: WhitespaceTokenizer

  # Extracts features using regular expressions
  - name: RegexFeaturizer

  # Extracts grammatical and positional features
  - name: LexicalSyntacticFeaturizer

  # Word-level features
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2

  # Character-level features
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # Intent classification and entity extraction
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true

  # Maps recognised entity synonyms
  - name: EntitySynonymMapper

  # Handles uncertain predictions
  - name: FallbackClassifier
    threshold: 0.30
    ambiguity_threshold: 0.10


# ==========================================
# DIALOGUE MANAGEMENT POLICIES
# ==========================================

policies:

  # Remembers previously learned conversation paths
  - name: MemoizationPolicy
    max_history: 5

  # Handles explicitly defined rules
  - name: RulePolicy

  # Predicts the next action in a conversation
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
